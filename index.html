<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    min-height:100%;
    margin:0;
}

html{
    background:#07111f;
}


/* =========================================================
   BODY
========================================================= */

body{

    margin:0;

    color:#fff;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    position:relative;

    overflow-x:hidden;

    background:#07111f;

    isolation:isolate;
}


/* =========================================================
   BACKGROUND PHOTO
   ali.mo.jpg
========================================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background-image:
        url("./ali.mo.jpg");

    background-position:center center;

    background-size:contain;

    background-repeat:no-repeat;

    background-color:#07111f;

    filter:blur(1.5px);

    opacity:0.78;

    z-index:-2;

    pointer-events:none;
}


/* =========================================================
   DARK GLASS OVERLAY
========================================================= */

body::after{

    content:"";

    position:fixed;

    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(4,12,24,0.42),
            rgba(4,12,24,0.62)
        );

    pointer-events:none;

    z-index:-1;
}


/* =========================================================
   CONTAINER
========================================================= */

.container{

    width:min(700px,100%);

    margin:auto;

    padding:
        18px
        14px
        35px;

    position:relative;

    z-index:1;
}


/* =========================================================
   BRAND
========================================================= */

.brand{

    position:relative;

    text-align:center;

    min-height:150px;

    padding-top:8px;

    background:
        rgba(255,255,255,0.035);

    border-radius:24px;

    border:
        1px solid
        rgba(255,255,255,0.12);

    backdrop-filter:
        blur(8px)
        saturate(120%);

    -webkit-backdrop-filter:
        blur(8px)
        saturate(120%);

    box-shadow:
        0 18px 50px
        rgba(0,0,0,0.25);
}


/* =========================================================
   LOGO
========================================================= */

.brand-logo{

    position:absolute;

    top:10px;

    left:10px;

    width:82px;

    height:82px;

    object-fit:contain;

    border-radius:16px;

    padding:5px;

    background:
        rgba(255,255,255,0.12);

    border:
        1px solid
        rgba(255,255,255,0.30);

    box-shadow:
        0 12px 35px
        rgba(0,0,0,0.40);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);
}


/* =========================================================
   BRAND TEXT
========================================================= */

.mohammadi{

    font-size:28px;

    font-weight:900;

    letter-spacing:2px;

    text-shadow:
        0 3px 15px
        rgba(0,0,0,0.75);
}


.steel{

    font-size:11px;

    letter-spacing:3px;

    color:#e2b34f;

    font-weight:900;

    text-shadow:
        0 2px 8px
        rgba(0,0,0,0.7);
}


.logo-text{

    font-size:32px;

    font-weight:950;

    margin:
        8px 0;

    text-shadow:
        0 3px 15px
        rgba(0,0,0,0.70);
}


.engineer{

    font-size:17px;

    font-weight:900;

    text-shadow:
        0 2px 8px
        rgba(0,0,0,0.75);
}


/* =========================================================
   PHONE
========================================================= */

.phone-main{

    display:inline-block;

    margin:7px;

    padding:
        8px
        15px;

    border-radius:12px;

    color:#ffd36b;

    background:
        rgba(255,255,255,0.10);

    border:
        1px solid
        rgba(217,164,65,0.60);

    text-decoration:none;

    font-size:21px;

    font-weight:950;

    direction:ltr;

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.18),

        0 8px 25px
        rgba(0,0,0,0.25);
}


/* =========================================================
   MAIN GLASS CARD
========================================================= */

.card{

    margin-top:14px;

    color:#102033;

    border-radius:24px;

    padding:19px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.22),
            rgba(255,255,255,0.10)
        );

    border:
        1px solid
        rgba(255,255,255,0.38);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,0.42),

        inset 0 1px 0
        rgba(255,255,255,0.30);

    backdrop-filter:
        blur(22px)
        saturate(145%);

    -webkit-backdrop-filter:
        blur(22px)
        saturate(145%);

    position:relative;

    overflow:hidden;
}


/* =========================================================
   GLASS HIGHLIGHT
========================================================= */

.card::before{

    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.70),
            transparent
        );

    pointer-events:none;
}


/* =========================================================
   GRID
========================================================= */

.grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;
}


/* =========================================================
   GLASS FIELD BOX
========================================================= */

.grid > div{

    padding:10px;

    border-radius:17px;

    background:
        rgba(255,255,255,0.075);

    border:
        1px solid
        rgba(255,255,255,0.20);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.16);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);
}


.full{

    grid-column:
        1 / -1;
}


/* =========================================================
   LABEL
========================================================= */

label{

    display:block;

    font-size:13px;

    font-weight:900;

    margin-bottom:6px;

    color:#17283c;

    text-shadow:
        0 1px 2px
        rgba(255,255,255,0.35);
}


/* =========================================================
   INPUT / SELECT — GLASS
========================================================= */

input,
select{

    width:100%;

    height:50px;

    border:
        1px solid
        rgba(255,255,255,0.42);

    border-radius:13px;

    background:
        rgba(255,255,255,0.20);

    padding:
        0 12px;

    font-size:17px;

    color:#101d2e;

    outline:none;

    transition:
        0.2s ease;

    backdrop-filter:
        blur(12px)
        saturate(135%);

    -webkit-backdrop-filter:
        blur(12px)
        saturate(135%);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.25),

        0 5px 15px
        rgba(0,0,0,0.08);
}


input::placeholder{

    color:
        rgba(30,45,65,0.62);
}


input:hover,
select:hover{

    background:
        rgba(255,255,255,0.27);

    border-color:
        rgba(255,255,255,0.58);
}


input:focus,
select:focus{

    border-color:#d71920;

    background:
        rgba(255,255,255,0.30);

    box-shadow:

        0 0 0 3px
        rgba(215,25,32,0.16),

        inset 0 1px 0
        rgba(255,255,255,0.35);
}


/* =========================================================
   SELECT OPTIONS
========================================================= */

option{

    background:#ffffff;

    color:#111827;
}


/* =========================================================
   CALCULATE BUTTON
========================================================= */

.calculate{

    width:100%;

    height:54px;

    margin-top:16px;

    border:0;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #d71920,
            #a80e15
        );

    color:#fff;

    font-size:17px;

    font-weight:950;

    cursor:pointer;

    box-shadow:
        0 10px 25px
        rgba(167,14,21,0.35),

        inset 0 1px 0
        rgba(255,255,255,0.20);

    transition:
        0.15s ease;
}


.calculate:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 14px 30px
        rgba(167,14,21,0.45);
}


.calculate:active{

    transform:
        translateY(0);
}


/* =========================================================
   RESULTS
========================================================= */

.results{

    display:none;

    margin-top:18px;
}


/* =========================================================
   TABS — GLASS
========================================================= */

.tabs{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;
}


.tab{

    height:48px;

    border:
        1px solid
        rgba(255,255,255,0.30);

    border-radius:13px;

    background:
        rgba(255,255,255,0.16);

    font-weight:900;

    cursor:pointer;

    color:#152033;

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.22);
}


.tab.active{

    background:
        linear-gradient(
            135deg,
            rgba(19,39,68,0.92),
            rgba(25,53,88,0.88)
        );

    color:#fff;

    border-color:
        rgba(255,255,255,0.25);

    box-shadow:
        0 8px 22px
        rgba(0,0,0,0.25),

        inset 0 1px 0
        rgba(255,255,255,0.18);
}


/* =========================================================
   RESULT PANEL — GLASS
========================================================= */

.panel{

    display:none;

    margin-top:10px;

    background:
        rgba(255,255,255,0.16);

    border:
        1px solid
        rgba(255,255,255,0.30);

    border-radius:18px;

    padding:
        22px
        10px;

    text-align:center;

    backdrop-filter:
        blur(16px)
        saturate(135%);

    -webkit-backdrop-filter:
        blur(16px)
        saturate(135%);

    box-shadow:

        inset 0 1px 0
        rgba(255,255,255,0.22),

        0 10px 30px
        rgba(0,0,0,0.12);
}


.panel.active{

    display:block;
}


.icon-result{

    font-size:29px;
}


.caption{

    color:#26384d;

    font-weight:900;
}


.number{

    font-size:32px;

    color:#d71920;

    font-weight:950;

    margin-top:5px;

    text-shadow:
        0 2px 5px
        rgba(0,0,0,0.12);
}


.unit{

    font-size:14px;

    color:#334155;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    text-align:center;

    color:#d5dce6;

    font-size:13px;

    line-height:2;

    margin-top:17px;

    text-shadow:
        0 2px 8px
        rgba(0,0,0,0.70);
}


.footer a{

    color:#ffd36b;

    text-decoration:none;
}


/* =========================================================
   SOCIAL
========================================================= */

.social{

    display:flex;

    justify-content:center;

    gap:16px;

    margin-top:10px;
}


.social a{

    width:42px;

    height:42px;

    border-radius:12px;

    background:
        rgba(23,43,70,0.62);

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    border:
        1px solid
        rgba(255,255,255,0.20);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.16);
}


.social svg{

    width:25px;

    height:25px;
}


/* =========================================================
   MODAL
========================================================= */

.modal{

    display:none;

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,0.75);

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:100;

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);
}


.modal-box{

    width:min(380px,100%);

    background:
        rgba(16,32,53,0.90);

    border-radius:20px;

    padding:22px;

    text-align:center;

    border:
        1px solid
        rgba(255,255,255,0.18);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,0.55);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);
}


.modal-button{

    display:block;

    width:100%;

    padding:13px;

    margin-top:10px;

    border-radius:12px;

    text-decoration:none;

    font-weight:900;

    border:0;

    cursor:pointer;
}


.call{

    background:#d9b45b;

    color:#111;
}


.whatsapp{

    background:#1f8f54;

    color:#fff;
}


.close{

    background:#243449;

    color:#fff;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px){

    body::before{

        background-size:contain;

        background-position:center center;

        filter:blur(1px);

        opacity:0.76;
    }


    .container{

        width:100%;

        padding:
            10px
            8px
            25px;
    }


    .brand{

        min-height:142px;

        border-radius:20px;
    }


    .brand-logo{

        width:58px;

        height:58px;

        top:7px;

        left:7px;

        border-radius:13px;
    }


    .mohammadi{

        font-size:22px;
    }


    .steel{

        font-size:9px;

        letter-spacing:2px;
    }


    .logo-text{

        font-size:26px;

        margin:
            6px 0;
    }


    .engineer{

        font-size:14px;
    }


    .phone-main{

        font-size:18px;

        padding:
            7px
            12px;
    }


    .card{

        margin-top:10px;

        padding:12px;

        border-radius:20px;

        backdrop-filter:
            blur(20px)
            saturate(140%);

        -webkit-backdrop-filter:
            blur(20px)
            saturate(140%);
    }


    .grid{

        grid-template-columns:1fr;

        gap:9px;
    }


    .grid > div{

        padding:8px;

        border-radius:15px;
    }


    .full{

        grid-column:auto;
    }


    label{

        font-size:12px;

        margin-bottom:5px;
    }


    input,
    select{

        height:48px;

        font-size:16px;
    }


    .calculate{

        height:52px;

        margin-top:13px;
    }


    .number{

        font-size:28px;
    }


    .tab{

        font-size:13px;

        height:46px;
    }


    .panel{

        padding:
            18px
            8px;
    }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:360px){

    .brand{

        min-height:135px;
    }


    .brand-logo{

        width:52px;

        height:52px;
    }


    .mohammadi{

        font-size:20px;
    }


    .logo-text{

        font-size:23px;
    }


    .engineer{

        font-size:13px;
    }


    .phone-main{

        font-size:16px;
    }


    .card{

        padding:9px;
    }
}


/* =========================================================
   REDUCE MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *{

        scroll-behavior:auto !important;

        transition:none !important;

        animation:none !important;
    }
}

</style>
