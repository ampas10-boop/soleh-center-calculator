<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Sooleh.Center | محاسبه وزن سوله</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:620px;margin:auto;padding:14px}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.10);overflow:hidden}
.head{background:linear-gradient(135deg,#111827,#263244);color:#fff;text-align:center;padding:20px 15px 18px}
.logo{width:105px;height:105px;object-fit:contain;border-radius:18px;margin-bottom:8px}
.bn{font-size:20px;font-weight:900;letter-spacing:1px}
.bs{font-size:11px;letter-spacing:2px;color:#d1d5db;margin-top:2px}
.bt{font-size:19px;font-weight:900;color:#fbbf24;margin-top:8px}
.d{font-size:14px;margin-top:7px;color:#e5e7eb}
.ph{display:inline-block;margin-top:9px;color:#fbbf24;font-size:18px;font-weight:900;text-decoration:none}
.main{padding:18px}
label{display:block;font-size:14px;font-weight:800;margin:13px 0 7px}
select,input{width:100%;height:50px;border:1px solid #d1d5db;border-radius:14px;background:#fff;padding:0 13px;font-size:16px;outline:none}
select:focus,input:focus{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.btn{width:100%;border:0;border-radius:15px;height:53px;margin-top:18px;background:#111827;color:#fff;font-size:17px;font-weight:900;cursor:pointer}
.res{display:none;margin-top:18px;border:1px solid #e5e7eb;border-radius:18px;overflow:hidden}
.tabs{display:flex;background:#f9fafb}
.tab{flex:1;border:0;background:transparent;padding:13px 5px;font-weight:900;font-size:14px;cursor:pointer}
.tab.on{background:#111827;color:#fff}
.panel{display:none;text-align:center;padding:25px 10px}
.panel.on{display:block}
.ico{font-size:38px}
.cap{font-size:15px;color:#6b7280;font-weight:800;margin-top:7px}
.num{font-size:29px;font-weight:900;color:#111827;margin-top:9px}
.unit{font-size:15px;color:#6b7280}
.foot{padding:17px;border-top:1px solid #eee;text-align:center;background:#fafafa}
.links{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.link{padding:9px 12px;border-radius:12px;background:#fff;border:1px solid #e5e7eb;text-decoration:none;color:#111827;font-size:13px;font-weight:800}
.note{font-size:11px;line-height:2;color:#6b7280;margin-top:13px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:20px;z-index:99}
.box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:360px;text-align:center}
.box h3{margin:0 0 15px}
.mb{display:block;text-decoration:none;padding:13px;border-radius:13px;margin-top:9px;font-weight:900}
.call{background:#111827;color:#fff}
.wa{background:#25d366;color:#fff}
.close{margin-top:12px;border:0;background:#eee;padding:10px 25px;border-radius:12px}
@media(max-width:430px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.num{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<header class="head">
<img class="logo" src="logo.jpg.jpg" alt="Sooleh.Center">
