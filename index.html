<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<title>محاسبه‌گر وزن سوله | Sooleh.Center</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  min-height:100vh;
  font-family:Tahoma,Arial,sans-serif;
  color:#fff;
  position:relative;
  isolation:isolate;
  overflow-x:hidden;
  background:#07111d;
}

/* =========================
   BACKGROUND PHOTO
   ========================= */

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;

  background-image:
    linear-gradient(
      rgba(3,10,18,.48),
      rgba(3,10,18,.55)
    ),
    url("./ali.mo.jpg");

  background-position:center center;
  background-repeat:no-repeat;

  /* مهم: عکس دیگر 2 برابر بزرگ نمی‌شود */
  background-size:contain;

  filter:blur(1px);
}

/* لایه بسیار ظریف برای خوانایی */
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;

  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(0,150,255,.10),
      transparent 45%
    ),
    linear-gradient(
      rgba(0,0,0,.08),
      rgba(0,0,0,.18)
    );
}

/* =========================
   MAIN CONTAINER
   ========================= */

.page{
  width:100%;
  min-height:100vh;
  padding:25px 15px 35px;
}

/* =========================
   LOGO
   ========================= */

.brand-logo{
  position:fixed;
  top:14px;
  left:14px;

  width:78px;
  height:78px;

  object-fit:contain;
  z-index:20;

  border-radius:18px;

  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.30);

  box-shadow:
    0 8px 30px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.35);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

/* =========================
   BRAND
   ========================= */

.brand{
  text-align:center;
  margin:5px auto 22px;
  padding:15px 100px 15px 100px;

  max-width:720px;

  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.20);

  border-radius:24px;

  box-shadow:
    0 15px 45px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.20);

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}

.brand-title{
  font-size:27px;
  font-weight:900;
  letter-spacing:1px;
}

.brand-subtitle{
  margin-top:4px;
  font-size:13px;
  opacity:.85;
  letter-spacing:2px;
}

.brand-center{
  margin-top:10px;
  font-size:16px;
  font-weight:bold;
}

.brand-engineer{
  margin-top:5px;
  font-size:14px;
  color:#ffe082;
  font-weight:bold;
}

.brand-phone{
  margin-top:8px;
  font-size:15px;
  direction:ltr;
  font-weight:bold;
}

/* =========================
   GLASS CARD
   ========================= */

.card{
  width:100%;
  max-width:900px;
  margin:0 auto;

  padding:22px;

  background:rgba(255,255,255,.13);

  border:1px solid rgba(255,255,255,.27);

  border-radius:28px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.28),
    inset 0 -1px 0 rgba(255,255,255,.08);

  backdrop-filter:blur(24px) saturate(135%);
  -webkit-backdrop-filter:blur(24px) saturate(135%);
}

/* =========================
   TITLE
   ========================= */

.section-title{
  text-align:center;
  font-size:23px;
  font-weight:900;
  margin-bottom:20px;
  color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.35);
}

/* =========================
   INPUT GRID
   ========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.field{
  padding:14px;

  background:rgba(255,255,255,.10);

  border:1px solid rgba(255,255,255,.20);

  border-radius:18px;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.15),
    0 8px 25px rgba(0,0,0,.12);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

.field label{
  display:block;
  margin-bottom:8px;

  font-size:13px;
  font-weight:bold;

  color:#fff;
}

input,
select{
  width:100%;
  height:48px;

  padding:0 13px;

  border:none;
  outline:none;

  border-radius:13px;

  background:rgba(255,255,255,.20);

  color:#fff;

  border:1px solid rgba(255,255,255,.25);

  font-family:inherit;
  font-size:15px;

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  transition:.2s;
}

input::placeholder{
  color:rgba(255,255,255,.65);
}

select option{
  color:#111;
  background:#fff;
}

input:focus,
select:focus{
  border-color:rgba(255,255,255,.65);

  background:rgba(255,255,255,.27);

  box-shadow:
    0 0 0 3px rgba(255,255,255,.08);
}

/* =========================
   CALCULATE BUTTON
   ========================= */

.calculate-btn{
  width:100%;
  height:56px;

  margin-top:20px;

  border:1px solid rgba(255,255,255,.30);
  border-radius:17px;

  background:
    linear-gradient(
      135deg,
      rgba(255,193,7,.90),
      rgba(255,152,0,.82)
    );

  color:#111;

  font-family:inherit;
  font-size:17px;
  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 12px 30px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.55);

  transition:.2s;
}

.calculate-btn:hover{
  transform:translateY(-2px);
  box-shadow:
    0 16px 35px rgba(0,0,0,.30),
    inset 0 1px 0 rgba(255,255,255,.55);
}

.calculate-btn:active{
  transform:translateY(0);
}

/* =========================
   RESULTS
   ========================= */

#results{
  display:none;
  margin-top:22px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:12px;
}

.tab{
  height:48px;

  border-radius:15px;

  border:1px solid rgba(255,255,255,.20);

  background:rgba(255,255,255,.10);

  color:#fff;

  font-family:inherit;
  font-weight:bold;
  font-size:14px;

  cursor:pointer;

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.tab.active{
  background:rgba(255,193,7,.78);
  color:#111;

  border-color:rgba(255,255,255,.40);
}

.panel{
  display:none;

  min-height:180px;

  padding:25px;

  text-align:center;

  border-radius:22px;

  background:rgba(255,255,255,.12);

  border:1px solid rgba(255,255,255,.23);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.20),
    0 15px 35px rgba(0,0,0,.18);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.panel.active{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.icon-result{
  font-size:38px;
  margin-bottom:8px;
}

.caption{
  font-size:14px;
  opacity:.85;
  margin-bottom:8px;
}

.number{
  font-size:34px;
  font-weight:900;
  color:#ffe082;

  direction:rtl;

  text-shadow:
    0 3px 15px rgba(0,0,0,.35);
}

.unit{
  font-size:17px;
  color:#fff;
}

/* =========================
   FOOTER
   ========================= */

.footer{
  width:100%;
  max-width:900px;
  margin:18px auto 0;

  padding:16px;

  text-align:center;

  background:rgba(255,255,255,.08);

  border:1px solid rgba(255,255,255,.17);

  border-radius:20px;

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  font-size:12px;
  line-height:2;
}

.footer strong{
  color:#ffe082;
}

.footer a{
  color:#fff;
  text-decoration:none;
}

/* =========================
   PHONE MODAL
   ========================= */

.phone-modal{
  display:none;

  position:fixed;
  inset:0;

  z-index:100;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.60);

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

.phone-box{
  width:100%;
  max-width:390px;

  padding:25px;

  border-radius:25px;

  background:rgba(255,255,255,.15);

  border:1px solid rgba(255,255,255,.30);

  box-shadow:0 25px 70px rgba(0,0,0,.45);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  text-align:center;
}

.phone-box h3{
  margin-top:0;
  margin-bottom:20px;
}

.phone-link{
  display:block;

  padding:14px;
  margin:10px 0;

  border-radius:14px;

  text-decoration:none;

  background:rgba(255,255,255,.13);

  color:#fff;

  border:1px solid rgba(255,255,255,.20);
}

.close-btn{
  margin-top:10px;

  border:none;
  background:transparent;

  color:#fff;

  font-family:inherit;
  cursor:pointer;

  opacity:.75;
}

/* =========================
   MOBILE
   ========================= */

@media(max-width:650px){

/* گوشی‌های خیلی کوچک */

  .number{

</style>

/* =========================================================
   CRANE ADDITION
   ========================================================= */

const craneAddition = {
  0:0,
  5:5,
  10:7.5,
  15:12,
  20:15,
  25:20,
  30:25,
  35:30,
  40:35,
  45:40,
  50:45
};


/* =========================================================
   SPAN BASE
   ========================================================= */

function spanBase(span){

  const table = [
    [12,25],
    [15,28],
    [18,29],
    [20,32],
    [25,38],
    [30,43],
    [50,57.54]
  ];

  if(span < 12 || span > 50){
    return NaN;
  }

  for(let i=0;i<table.length-1;i++){

    if(span <= table[i+1][0]){

      const x1 = table[i][0];
      const y1 = table[i][1];

      const x2 = table[i+1][0];
      const y2 = table[i+1][1];

      return y1 +
        (span-x1) *
        (y2-y1) /
        (x2-x1);
    }
  }

  return 57.54;
}


/* =========================================================
   NUMBER CONVERSION
   ========================================================= */

function toNumber(value){

  let text = String(value);

  text = text.replace(
    /[۰-۹]/g,
    d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)
  );

  text = text.replace(
    /[٠-٩]/g,
    d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)
  );

  text = text
    .replace(/٫/g,".")
    .replace(/[,٬]/g,"");

  return parseFloat(text);
}


function persianNumber(value){

  return value.toLocaleString(
    "fa-IR",
    {
      maximumFractionDigits:2
    }
  );
}

  }

  provinces[index].cities.forEach(

}


/* =========================================================
   CALCULATE
   ========================================================= */

function calculateWeight(){

  const span =
    toNumber(
      document.getElementById("span").value
    );

  const length =
    toNumber(
      document.getElementById("length").value
    );

  const height =
    toNumber(
      document.getElementById("height").value
    );

  const crane =
    toNumber(
      document.getElementById("crane").value
    );

  const provinceIndex =
    provinceSelect.value;


  if(
    provinceIndex === "" ||
    citySelect.value === "" ||
    !isFinite(span) ||
    !isFinite(length) ||
    !isFinite(height) ||
    span < 12 ||
    span > 50 ||
    length <= 0 ||
    height <= 0
  ){

    alert(
      "لطفاً استان، شهر و تمام ابعاد را صحیح وارد کنید."
    );

    return;
  }


  const area =
    (span + 2) *
    (length + 2);


  const baseWeight =
    spanBase(span);


  const provinceRate =
    provinces[provinceIndex].rate;


  const provinceAdjustment =
    provinceRate - 32;


  const heightAdjustment =
    (height - 6) * 2;


  const craneWeight =
    craneAddition[crane] || 0;


  const kgPerSquareMeter =
    baseWeight +
    provinceAdjustment +
    heightAdjustment +
    craneWeight;


  const totalWeight =
    area *
    kgPerSquareMeter /
    1000;


  const roofCover =
    (span + 3) *
    (length + 2) +
    (length / 2);


  document.getElementById("weightPanel").innerHTML =

    '<div class="icon-result">⚖️</div>' +

    '<div class="caption">وزن تقریبی سوله</div>' +

    '<div class="number">' +

    persianNumber(totalWeight) +

    ' <span class="unit">تن</span>' +

    '</div>';


  document.getElementById("coverPanel").innerHTML =

    '<div class="icon-result">🏠</div>' +

    '<div class="caption">متراژ پوشش سقف</div>' +

    '<div class="number">' +

    persianNumber(roofCover) +

    ' <span class="unit">مترمربع</span>' +

    '</div>';


  document.getElementById("results")
    .style.display = "block";


  showTab(
    "weightPanel",
    "weightTab"
  );
}


/* =========================================================
   TABS
   ========================================================= */

function showTab(panelId,tabId){

  document
    .querySelectorAll(".panel")
    .forEach(
      panel =>
        panel.classList.remove("active")
    );


  document
    .querySelectorAll(".tab")
    .forEach(
      tab =>
        tab.classList.remove("active")
    );


  document
    .getElementById(panelId)
    .classList.add("active");


  document
    .getElementById(tabId)
    .classList.add("active");
}

function closePhoneModal(event){

  const modal =
    document.getElementById("phoneModal");

  if(

    event.target === modal
  ){

    modal.style.display = "none";
  }
}
