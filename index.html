<style>

*{
    box-sizing:border-box;
}

html,
body{
    min-height:100%;
}

body{

    margin:0;

    color:#fff;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            145deg,
            #07111f,
            #102640 55%,
            #310f15
        );

    position:relative;

    overflow-x:hidden;

}


/* =========================================================
   BACKGROUND PHOTO
========================================================= */

body::before{

    content:"";

    position:fixed;

    inset:-25px;

    background-image:
        linear-gradient(
            rgba(5,12,22,0.68),
            rgba(5,12,22,0.72)
        ),
        url("./ali.mo.jpg");

    background-position:center;

    background-size:cover;

    background-repeat:no-repeat;

    filter:blur(5px);

    opacity:0.58;

    transform:scale(1.04);

    z-index:-2;

}


/* =========================================================
   DARK OVERLAY
========================================================= */

body::after{

    content:"";

    position:fixed;

    inset:0;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(255,255,255,0.08),
            transparent 35%
        );

    pointer-events:none;

    z-index:-1;

}


/* =========================================================
   CONTAINER
========================================================= */

.container{

    width:min(700px,100%);

    margin:auto;

    padding:
        18px
        14px
        35px;

}


/* =========================================================
   BRAND AREA
========================================================= */

.brand{

    position:relative;

    text-align:center;

    min-height:145px;

    padding-top:8px;

}


/* LOGO */

.brand-logo{

    position:absolute;

    top:0;

    left:0;

    width:82px;

    height:82px;

    object-fit:contain;

    border-radius:16px;

    background:
        rgba(255,255,255,0.10);

    border:
        1px solid
        rgba(255,255,255,0.22);

    padding:5px;

    box-shadow:

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

}

.mohammadi{

    font-size:28px;

    font-weight:900;

    letter-spacing:2px;

    text-shadow:
        0 3px 15px
        rgba(0,0,0,0.5);

}

.steel{

    font-size:11px;

    letter-spacing:3px;

    color:#e2b34f;

    font-weight:900;

}

.logo-text{

    font-size:32px;

    font-weight:950;

    margin:8px 0;

}

.engineer{

    font-size:17px;

    font-weight:900;

}

.phone-main{

    display:inline-block;

    margin:7px;

    padding:
        8px
        15px;

    border-radius:12px;

    color:#ffd36b;

    background:
        rgba(255,255,255,0.09);

    border:
        1px solid
        rgba(217,164,65,0.55);

    text-decoration:none;

    font-size:21px;

    font-weight:950;

    direction:ltr;

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

}


/* =========================================================
   GLASS CARD
========================================================= */

.card{

    margin-top:12px;

    color:#152033;

    border-radius:24px;

    padding:19px;

    background:
        rgba(255,255,255,0.76);

    border:
        1px solid
        rgba(255,255,255,0.65);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,0.42);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

}


/* =========================================================
   GRID
========================================================= */

.grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

}

.full{

    grid-column:
        1 / -1;

}


/* =========================================================
   LABEL
========================================================= */

label{

    display:block;

    font-size:13px;

    font-weight:900;

    margin-bottom:6px;

    color:#26364b;

}


/* =========================================================
   INPUT / SELECT
========================================================= */

input,
select{

    width:100%;

    height:50px;

    border:
        1px solid
        rgba(180,195,210,0.75);

    border-radius:13px;

    background:
        rgba(248,250,252,0.78);

    padding:
        0 12px;

    font-size:17px;

    color:#111827;

    outline:none;

    transition:
        0.2s ease;

}


input:focus,
select:focus{

    border-color:#d71920;

    box-shadow:
        0 0 0 3px
        rgba(215,25,32,0.12);

}


/* =========================================================
   CALCULATE BUTTON
========================================================= */

    border-radius:15px;

        linear-gradient(

        0 10px 25px
        rgba(167,14,21,0.30);

    transition:
        transform .15s ease,
        box-shadow .15s ease;

}

.calculate:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 14px 30px
        rgba(167,14,21,0.40);

}

.calculate:active{

    transform:
        translateY(0);

/* =========================================================
   RESULTS
========================================================= */

.results{

    display:none;

    margin-top:18px;

}

.tabs{

        1fr 1fr;

    gap:8px;

.tab{

    height:48px;

    border:
        1px solid

    border-radius:13px;

    background:
        rgba(241,245,249,0.82);

    font-weight:900;

    cursor:pointer;

    color:#152033;

}

.tab.active{

    background:#132744;

    color:#fff;

}


/* PANEL */

.panel{

    margin-top:10px;

    background:
        rgba(243,246,250,0.82);

    border:
        1px solid
        rgba(227,232,239,0.85);

    border-radius:18px;

    padding:

        10px;

    text-align:center;

}

.panel.active{

    display:block;

/* RESULT */

.icon-result{

    font-size:29px;

}

.caption{

    color:#64748b;

    font-weight:900;

}

.number{

    font-size:32px;

    color:#d71920;

    font-weight:950;

    margin-top:5px;

}

.unit{

    font-size:14px;

/* =========================================================

========================================================= */

.footer{

.footer a{

.social a{

    height:42px;

.social svg{

/* =========================================================

========================================================= */

.modal{

    inset:0;

    background:

    align-items:center;

    justify-content:center;

    padding:20px;

.call{

    color:#111;

.whatsapp{

    background:#1f8f54;

    color:#fff;

.close{

];

const y1=table[i][1];

const y2=table[i+1][1];

return y1+
(span-x1)*
(y2-y1)/

}

}

}



/* =========================================================
   NUMBER CONVERTER
========================================================= */

function toNumber(value){

let text=String(value);


text=text.replace(
    /[۰-۹]/g,
    function(d){
        return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);
    }
);


text=text.replace(
    /[٠-٩]/g,
    function(d){
        return "٠١٢٣٤٥٦٧٨٩".indexOf(d);
    }
);


text=text
.replace(/٫/g,".")
.replace(/[,٬]/g,"");


return parseFloat(text);

}



/* =========================================================
   PERSIAN NUMBER
========================================================= */

function persianNumber(value){

return value.toLocaleString(
    "fa-IR",
    {
        maximumFractionDigits:2
    }
);

}

/* =========================================================
   CALCULATE
========================================================= */

function calculateWeight(){


const span=
toNumber(
document.getElementById("span").value
);


const length=
toNumber(
document.getElementById("length").value
);


const height=
toNumber(
document.getElementById("height").value
);


const crane=
toNumber(
document.getElementById("crane").value
);


const provinceIndex=
provinceSelect.value;



/* VALIDATION */

if(

provinceIndex===""

||

citySelect.value===""

||

!isFinite(span)

||

!isFinite(length)

||

!isFinite(height)

||

span<12

||

span>50

||

length<=0

||

height<=0

){

alert(
"لطفاً استان، شهر و تمام ابعاد را صحیح وارد کنید."
);

return;

}



/* AREA */

const area=
(span+2)*
(length+2);



/* BASE */

const baseWeight=
spanBase(span);



/* PROVINCE */

const provinceRate=
provinces[provinceIndex].rate;

const provinceAdjustment=
provinceRate-32;



/* HEIGHT */

const heightAdjustment=
(height-6)*2;



/* CRANE */

const craneWeight=
craneAddition[crane]||0;



/* KG/M2 */

const kgPerSquareMeter=

baseWeight+
provinceAdjustment+
heightAdjustment+
craneWeight;



/* TOTAL */

const totalWeight=

area*
kgPerSquareMeter/
1000;



/* ROOF */

const roofCover=

(span+3)*
(length+2)
+
(length/2);



/* WEIGHT RESULT */

document.getElementById(
    "weightPanel"
).innerHTML=

'<div class="icon-result">⚖️</div>'+

'<div class="caption">'+
'وزن تقریبی سوله'+
'</div>'+

'<div class="number">'+
persianNumber(totalWeight)+
' <span class="unit">تن</span>'+
'</div>';



/* ROOF RESULT */

document.getElementById(
    "coverPanel"
).innerHTML=

'<div class="icon-result">🏠</div>'+

'<div class="caption">'+
'متراژ پوشش سقف'+
'</div>'+

'<div class="number">'+
persianNumber(roofCover)+
' <span class="unit">مترمربع</span>'+
'</div>';



/* SHOW */

document.getElementById(
    "results"
).style.display="block";


showTab(
    "weightPanel",
    "weightTab"
);

}

function showTab(panelId,tabId){

document
.querySelectorAll(".panel")
.forEach(
function(panel){

panel.classList.remove("active");

});


document
.querySelectorAll(".tab")
.forEach(
function(tab){

tab.classList.remove("active");

});


document
.getElementById(panelId)
.classList.add("active");


document
.getElementById(tabId)
.classList.add("active");

}
