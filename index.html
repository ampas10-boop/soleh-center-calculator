<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Sooleh.Center | محاسبه وزن سوله</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  color:#fff;
  font-family:Tahoma,Arial,sans-serif;
  background:#07111f;
  overflow-x:hidden;
  position:relative;
}

body::before{
  content:"";
  position:fixed;
  inset:-20px;
  background:
    linear-gradient(
      rgba(3,10,20,.52),
      rgba(3,10,20,.68)
    ),
    url("./ali.mo.jpg");
  background-position:center center;
  background-size:cover;
  background-repeat:no-repeat;
  filter:blur(2px);
  transform:scale(1.03);
  z-index:-2;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(255,255,255,.12),
      transparent 35%
    ),
    radial-gradient(
      circle at 80% 90%,
      rgba(0,100,255,.12),
      transparent 40%
    );
  z-index:-1;
  pointer-events:none;
}

.container{
  width:min(720px,100%);
  margin:auto;
  padding:16px 14px 35px;
}

/* =========================
   BRAND
========================= */

.brand{
  position:relative;
  text-align:center;
  min-height:155px;
  padding-top:8px;
}

.brand-logo{
  position:absolute;
  top:0;
  left:0;
  width:82px;
  height:82px;
  object-fit:contain;
  border-radius:18px;
  padding:5px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.28);
  box-shadow:0 12px 35px rgba(0,0,0,.35);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}

.mohammadi{
  font-size:29px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 3px 15px rgba(0,0,0,.7);
}

.steel{
  color:#ffd34d;
  font-size:11px;
  font-weight:bold;
  letter-spacing:4px;
  margin-top:2px;
}

.logo-text{
  font-size:31px;
  font-weight:900;
  margin-top:8px;
  letter-spacing:.5px;
}

.engineer{
  margin-top:7px;
  font-size:17px;
  font-weight:bold;
}

.phone-main{
  display:inline-block;
  margin-top:10px;
  padding:7px 15px;
  color:#ffd34d;
  font-size:18px;
  font-weight:bold;
  border-radius:14px;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  cursor:pointer;
}

/* =========================
   MAIN CARD
========================= */

.card{
  margin-top:8px;
  padding:20px;
  color:#152033;
  border-radius:26px;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.72);
  box-shadow:
    0 25px 70px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.8);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}

.title{
  text-align:center;
  font-size:22px;
  font-weight:900;
  margin-bottom:17px;
}

.subtitle{
  text-align:center;
  color:#475569;
  font-size:12px;
  margin-top:-9px;
  margin-bottom:18px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

label{
  color:#263449;
  font-size:13px;
  font-weight:bold;
}

input,
select{
  width:100%;
  height:50px;
  border:none;
  outline:none;
  border-radius:14px;
  padding:0 14px;
  font-family:inherit;
  font-size:15px;
  color:#172033;
  background:rgba(248,250,252,.86);
  border:1px solid rgba(15,23,42,.12);
  box-shadow:
    inset 0 1px 2px rgba(0,0,0,.04),
    0 5px 15px rgba(0,0,0,.04);
}

input:focus,
select:focus{
  border-color:#d71920;
  box-shadow:0 0 0 3px rgba(215,25,32,.12);
}

.calculate{
  width:100%;
  height:55px;
  margin-top:18px;
  border:0;
  border-radius:16px;
  color:#fff;
  font-family:inherit;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  background:linear-gradient(135deg,#d71920,#9d0710);
  box-shadow:
    0 12px 25px rgba(150,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.25);
}

.calculate:active{
  transform:translateY(1px);
}

/* =========================
   RESULTS
========================= */

.results{
  display:none;
  margin-top:18px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:10px;
}

.tab{
  height:48px;
  border:0;
  border-radius:14px;
  background:rgba(255,255,255,.60);
  color:#263449;
  font-family:inherit;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.tab.active{
  color:#fff;
  background:#13233a;
}

.panel{
  display:none;
  text-align:center;
  padding:25px 15px;
  border-radius:19px;
  background:rgba(255,255,255,.70);
  border:1px solid rgba(255,255,255,.65);
}

.panel.active{
  display:block;
}

.icon-result{
  font-size:40px;
  margin-bottom:8px;
}

.caption{
  color:#475569;
  font-size:14px;
  font-weight:bold;
}

.number{
  margin-top:9px;
  color:#10233c;
  font-size:38px;
  font-weight:900;
}

.unit{
  font-size:17px;
}

/* =========================
   FOOTER
========================= */

.footer{
  text-align:center;
  margin-top:18px;
  color:#fff;
  font-size:14px;
  text-shadow:0 2px 8px #000;
}

.footer > a{
  color:#fff;
  text-decoration:none;
  font-weight:bold;
}

/* SOCIAL ICONS */

.social{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  margin-top:16px;
}

.social a{
  width:46px;
  height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  color:#fff;
  text-decoration:none;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.30);
  box-shadow:
    0 8px 24px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.35);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  transition:
    transform .25s ease,
    background .25s ease,
    box-shadow .25s ease;
}

.social a:hover{
  transform:translateY(-4px) scale(1.06);
  background:rgba(255,255,255,.24);
  box-shadow:
    0 12px 30px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.5);
}

.social a:active{
  transform:scale(.94);
}

.social svg{
  width:23px;
  height:23px;
  display:block;
}

/* =========================
   MODAL
========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.60);
  z-index:100;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

.modal-box{
  width:min(360px,100%);
  padding:18px;
  border-radius:24px;
  background:rgba(255,255,255,.88);
  box-shadow:0 25px 70px rgba(0,0,0,.4);
}

.modal-button{
  display:block;
  width:100%;
  padding:15px;
  margin-bottom:10px;
  border:0;
  border-radius:14px;
  text-align:center;
  text-decoration:none;
  font-family:inherit;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.call{
  color:#fff;
  background:#14263f;
}

.whatsapp{
  color:#fff;
  background:#159447;
}

.close{
  color:#263449;
  background:#e8edf3;
  margin-bottom:0;
}

/* =========================
   MOBILE
========================= */

@media(max-width:520px){

  .container{
    padding:10px 9px 25px;

  .brand{
    min-height:145px;
  }

  .brand-logo{
    width:65px;

  }

  }

  }

    grid-template-columns:1fr;
  }

  .field.full{

  }

  .number{
    font-size:30px;
  }
}

</style>
</head>

/* =========================
   CRANE
========================= */

const craneAddition = {

  0:0,
  5:5,
  10:7.5,
  15:12,
  20:15,
  25:20,
  30:25,
  35:30,
  40:35,
  45:40,
  50:45

};


/* =========================
   SPAN TABLE
========================= */

function spanBase(span){

  const table=[
    [12,25],
    [15,28],
    [18,29],
    [20,32],
    [25,38],
    [30,43],
    [50,57.54]
  ];

  if(span<12 || span>50){
    return NaN;
  }

  for(let i=0;i<table.length-1;i++){

    if(span<=table[i+1][0]){

      const x1=table[i][0];
      const y1=table[i][1];

      const x2=table[i+1][0];
      const y2=table[i+1][1];

      return y1+
        (span-x1)*
        (y2-y1)/
        (x2-x1);
    }

  }

  return 57.54;
}


/* =========================
   NUMBER
========================= */

function toNumber(value){

  let text=String(value);

  text=text.replace(
    /[۰-۹]/g,
    d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)
  );

  text=text.replace(
    /[٠-٩]/g,
    d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)
  );

  text=text
    .replace(/٫/g,".")
    .replace(/[,٬]/g,"");

  return parseFloat(text);
}


function persianNumber(value){

  return value.toLocaleString(
    "fa-IR",
    {
      maximumFractionDigits:2
    }
  );

}

/* =========================
   CALCULATE
========================= */

function calculateWeight(){

  const span=
    toNumber(
      document.getElementById("span").value
    );

  const length=
    toNumber(
      document.getElementById("length").value
    );

  const height=
    toNumber(
      document.getElementById("height").value
    );

  const crane=
    toNumber(
      document.getElementById("crane").value
    );

  const provinceIndex=
    provinceSelect.value;


  if(
    provinceIndex==="" ||
    citySelect.value==="" ||
    !isFinite(span) ||
    !isFinite(length) ||
    !isFinite(height) ||
    span<12 ||
    span>50 ||
    length<=0 ||
    height<=0
  ){

    alert(
      "لطفاً استان، شهر و تمام ابعاد را صحیح وارد کنید."
    );

    return;
  }


  const area=
    (span+2)*(length+2);


  const baseWeight=
    spanBase(span);


  const provinceRate=
    provinces[provinceIndex].rate;


  const provinceAdjustment=
    provinceRate-32;


  const heightAdjustment=
    (height-6)*2;


  const craneWeight=
    craneAddition[crane] || 0;


  const kgPerSquareMeter=
    baseWeight+
    provinceAdjustment+
    heightAdjustment+
    craneWeight;


  const totalWeight=
    area*
    kgPerSquareMeter/
    1000;


  const roofCover=
    (span+3)*
    (length+2)+
    (length/2);


  document.getElementById(
    "weightPanel"
  ).innerHTML=

    '<div class="icon-result">⚖️</div>'+
    '<div class="caption">وزن تقریبی سوله</div>'+
    '<div class="number">'+
    persianNumber(totalWeight)+
    ' <span class="unit">تن</span>'+
    '</div>';


  document.getElementById(
    "coverPanel"
  ).innerHTML=

    '<div class="icon-result">🏠</div>'+
    '<div class="caption">متراژ پوشش سقف</div>'+
    '<div class="number">'+
    persianNumber(roofCover)+
    ' <span class="unit">مترمربع</span>'+
    '</div>';


  document.getElementById(
    "results"
  ).style.display="block";


  showTab(
    "weightPanel",
    "weightTab"
  );

}


/* =========================
   TABS
========================= */

function showTab(panelId,tabId){

  document
    .querySelectorAll(".panel")
    .forEach(
      panel=>
        panel.classList.remove("active")
    );


  document
    .querySelectorAll(".tab")
    .forEach(
      tab=>
        tab.classList.remove("active")
    );


  document
    .getElementById(panelId)
    .classList.add("active");


  document
    .getElementById(tabId)
    .classList.add("active");

}

========================= */

function closePhoneModal(event){

  const modal=
    document.getElementById("phoneModal");


  if(
    !event ||
    event.target===modal
  ){

    modal.style.display="none";

  }

}
